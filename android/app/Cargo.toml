[package]
name = "androidcraft"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "androidcraft"
crate-type = ["cdylib"]

# Standalone workspace: the Android entry point needs `#[no_mangle]`, which the main workspace
# forbids (`unsafe_code = "forbid"`). The engine and UI crates it uses keep those rules.
[workspace]

[dependencies]
effectcraft-host = { path = "../../crates/host" }
effectcraft-ui-mobile = { path = "../../crates/ui-mobile" }
eframe = { version = "0.36", default-features = false, features = ["android-native-activity", "glow", "default_fonts"] }
egui = "0.36"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[profile.release]
opt-level = 2
codegen-units = 16
lto = false
debug = false

[package.metadata.android]
package = "app.androidcraft"
apk_name = "AndroidCraft"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "AndroidCraft"

[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"
